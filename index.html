<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Blocky Walk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<audio id="sound" src="sharingan.mp3"></audio>
<style>
/* Layout: full-viewport 3D canvas; hint top-left, hotbar bottom-centre, ability cards bottom-right. */
:root {
  --sky: #9fd3f2;
  --ink: #16324a;
  --hint-bg: rgba(255, 255, 255, 0.82);
  --panel: rgba(16, 18, 28, 0.82);
  --panel-line: rgba(255, 255, 255, 0.22);
  --panel-ink: #f2f4f8;
  --panel-dim: #aab2c4;
  --icon-bg: rgba(255, 255, 255, 0.07);
  --blood: #e5333f;
  --blood-glow: rgba(229, 51, 63, 0.55);
  --cd-shade: rgba(0, 0, 0, 0.66);
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#game { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

.hint {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  max-width: calc(100% - 32px);
  box-sizing: border-box;
  padding: 8px 12px;
  background: var(--hint-bg);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.5;
  border-radius: 6px;
  pointer-events: none;
}
.hint b { font-weight: 700; }
/* Hotbar */
#hotbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 8px;
}
.slot { position: relative; }
.slot button {
  position: relative;
  width: 68px;
  height: 68px;
  padding: 0;
  background: var(--panel);
  border: 2px solid var(--panel-line);
  border-radius: 8px;
  color: var(--panel-ink);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.slot button:hover { border-color: var(--panel-ink); }
.slot.equipped button { border-color: var(--blood); box-shadow: 0 0 14px var(--blood-glow); }
.slot .num {
  position: absolute;
  top: 4px;
  left: 7px;
  font-size: 12px;
  font-weight: 700;
  color: var(--panel-dim);
}
.slot.equipped .num { color: var(--panel-ink); }
.slot svg { width: 46px; height: 46px; }
.katana .blade { stroke: var(--panel-ink); stroke-width: 3.2; stroke-linecap: round; fill: none; }
.katana .grip { stroke: var(--blood); stroke-width: 4; stroke-linecap: round; fill: none; }
.katana .guard { stroke: var(--panel-dim); stroke-width: 2.4; stroke-linecap: round; fill: none; }
/* The Sharingan slot is an indicator: T toggles it, so the slot itself is not clickable */
#slot2 button, #slot3 button { pointer-events: none; cursor: default; }
#toast {
  position: fixed;
  top: calc(64px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 12px;
  background: var(--panel);
  color: var(--panel-ink);
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
  z-index: 3;
}
#toast.on { opacity: 1; }
/* Player health: bottom-left panel, plus a red edge flash when you get hit */
#hp {
  position: fixed;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 200px;
  box-sizing: border-box;
  padding: 8px 10px;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  color: var(--panel-ink);
  font-size: 13px;
  font-weight: 700;
}
#hp .row { display: flex; justify-content: space-between; margin-bottom: 5px; font-variant-numeric: tabular-nums; }
#hp .track { height: 12px; background: rgba(255, 255, 255, 0.12); border-radius: 4px; overflow: hidden; }
#hp .fill { height: 100%; width: 100%; background: #4cd964; transition: width 0.12s; }
#hurt {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(229, 51, 63, 0) 55%, rgba(229, 51, 63, 0.55) 100%);
  opacity: 0;
  transition: opacity 0.3s;
}
#hurt.on { opacity: 1; transition: none; }
@media (max-width: 560px) { #hp { width: 130px; } }
@keyframes slotPop {
  0% { transform: scale(0.4); opacity: 0; }
  60% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.slot.pop { animation: slotPop 0.35s ease-out; }
@media (prefers-reduced-motion: reduce) { .slot.pop { animation: none; } }
.sharingan .iris { fill: var(--blood); }
.sharingan .mark { fill: #0b0b10; }
.sharingan .ring { fill: none; stroke: #0b0b10; stroke-width: 1.6; }
.rinnegan .iris { fill: #b9a3e3; }
.rinnegan .ring { fill: none; stroke: #2a1f3d; stroke-width: 1.6; }
.rinnegan .pupil { fill: #2a1f3d; }
#slot3.equipped button { border-color: #a98fdc; box-shadow: 0 0 14px rgba(169, 143, 220, 0.7); }
#abCT .icon { color: #b9a3e3; }
#abCT.holding { border-color: #a98fdc; box-shadow: 0 0 14px rgba(169, 143, 220, 0.7); }
#abCT .charge { background: #a98fdc; }
#abST .icon { color: #c7b3ff; }
#abST.holding { border-color: #b9a3e3; box-shadow: 0 0 14px rgba(185, 163, 227, 0.7); }
.slot .tip {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  padding: 4px 10px;
  background: var(--panel);
  color: var(--panel-ink);
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s;
}
.pistol .body { fill: #c8d4df; stroke: #182635; stroke-width: 2.5; stroke-linejoin: round; }
.pistol .grip { fill: #394655; stroke: #182635; stroke-width: 2; }
.slot.pistol-equipped button { border-color: #63c7ff; box-shadow: 0 0 14px rgba(99,199,255,.65); }
#multiplayer { position:fixed; top:16px; right:16px; z-index:4; display:flex; gap:6px; padding:7px; border-radius:8px; background:var(--panel); color:var(--panel-ink); }
#multiplayer input { width:110px; border:1px solid var(--panel-line); border-radius:5px; padding:6px; }
#multiplayer button { border:0; border-radius:5px; padding:6px 9px; cursor:pointer; }
#mpStatus { align-self:center; color:var(--panel-dim); font-size:12px; }
.slot:hover .tip, .slot.equipped .tip { opacity: 1; }

/* Ability cards */
/* Both ability panels can be visible at once (Sharingan stays on with the katana), so they stack in one dock */
#dock {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column-reverse;
  align-items: flex-end;
  gap: 8px;
}
#abilities, #abilitiesEye {
  display: none;
  flex-direction: column;
  gap: 8px;
}
#abilities.on, #abilitiesEye.on { display: flex; }
.ability .icon svg .fillme { fill: currentColor; stroke: none; }
.ability .icon svg .crow,
.ability .icon svg .blackflame { fill: #0b0b10; stroke: currentColor; stroke-width: 2.5; stroke-linejoin: round; }
.ability {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px 6px 6px;
  background: var(--panel);
  border: 2px solid var(--panel-line);
  border-radius: 8px;
  color: var(--panel-ink);
  overflow: hidden;
}
.ability.holding { border-color: var(--blood); box-shadow: 0 0 14px var(--blood-glow); }
.ability .icon {
  position: relative;
  flex: none;
  width: 48px;
  height: 48px;
  background: var(--icon-bg);
  border-radius: 6px;
  color: var(--blood);
}
.ability .icon svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.ability .key {
  position: absolute;
  top: 2px;
  left: 4px;
  font-size: 12px;
  font-weight: 800;
  color: var(--panel-ink);
}
.ability .name { font-size: 14px; font-weight: 700; white-space: nowrap; }
.ability .cd {
  position: absolute;
  inset: 0;
  background: var(--cd-shade);
  transform-origin: bottom;
  transform: scaleY(0);
  pointer-events: none;
  z-index: 1;
}
.ability .cdtext {
  position: absolute;
  left: 6px;
  top: 6px;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 800;
  color: var(--panel-ink);
  z-index: 2;
  font-variant-numeric: tabular-nums;
}
.ability .charge {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 4px;
  width: 0;
  background: var(--blood);
  z-index: 3;
  pointer-events: none;
}
@media (max-width: 560px) {
  .ability .name { display: none; }
  .ability { padding: 6px; }
}
</style>

<script>
(function () {
  // ---------------------------------------------------------------- Key bindings
  // Each key points to the action it does: "key": "action". Change the key on the left to rebind.
  // Keys are the key's character ("g", "1", " " for Space) or its name ("arrowup", "shift", "enter").
  // Give an action several keys by listing it more than once (like "w" and "arrowup" below).
  // A key can do two actions that never happen together with a list: "c" is Tsukuyomi with the
  // Sharingan and Chibaku Tensei with the Rinnegan. The labels on screen update by themselves.
  var KEYS = {
    "w": "forward",
    "arrowup": "forward",
    "s": "back",
    "arrowdown": "back",
    "a": "left",
    "arrowleft": "left",
    "d": "right",
    "arrowright": "right",
    " ": "jump",
    "q": "quick dash",                    // short dash in the direction you're walking
    "r": "teleport",                      // teleport to the cursor
    "1": "katana",                        // equip / put away the Dual Cursed Katana
    "4": "pistol",                        // equip / put away the pistol
    "g": "revolving ravager",             // hold (katana)
    "h": ["slayer of goliath", "tsukuyomi clone"], // hold to dash (katana) / summon the clone during Tsukuyomi
    "x": ["tsukuyomi", "chibaku tensei"], // Tsukuyomi (Mangekyou) / hold for Chibaku Tensei (Rinnegan)
    "z": ["amaterasu", "shinra tensei"],  // Amaterasu (Mangekyou, cursor on a target) / hold for Shinra Tensei (Rinnegan)
    "j": "rinnegan",                      // toggle the Rinnegan
    "t": "sharingan",                     // toggle the Sharingan
    "y": "mangekyou",                     // toggle the Mangekyou (needs the Sharingan)
    "c": "clone"                          // Clone (Sharingan or Rinnegan)
  };

  function keyList(action) {
    return Object.keys(KEYS).filter(function (k) {
      var a = KEYS[k];
      return (Array.isArray(a) ? a : [a]).some(function (x) { return String(x).toLowerCase() === action; });
    }).map(function (k) { return k.toLowerCase(); });
  }
  function isKey(k, action) { return keyList(action).indexOf(k) >= 0; }
  function keyLabel(action) {
    var k = keyList(action)[0];
    if (k === undefined) return '';
    var names = { ' ': 'Space', arrowup: '\u2191', arrowdown: '\u2193', arrowleft: '\u2190', arrowright: '\u2192' };
    if (names[k]) return names[k];
    return k.length === 1 ? k.toUpperCase() : k.charAt(0).toUpperCase() + k.slice(1);
  }
  document.querySelectorAll('[data-key]').forEach(function (el) { el.textContent = keyLabel(el.dataset.key); });
  document.querySelectorAll('[data-name-key]').forEach(function (el) {
    var label = keyLabel(el.dataset.nameKey);
    if (label) el.textContent += ' (' + label + ')';
  });
  document.querySelectorAll('[data-aria-key]').forEach(function (el) {
    el.setAttribute('aria-label', el.getAttribute('aria-label') + ', key ' + keyLabel(el.dataset.ariaKey));
  });

  function playSoundSharingan() {
    const sound = document.getElementById("sound");
    sound.currentTime = 0.19;
    sound.play();
  }
  var canvas = document.getElementById('game');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;

  var scene = new THREE.Scene();
  var skyColor = new THREE.Color(0x9fd3f2);
  scene.background = skyColor;
  scene.fog = new THREE.Fog(skyColor, 60, 220);

  var camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);

  // Lights
  scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa77, 0.75));
  var sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(12, 24, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
  sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 60;
  scene.add(sun);

  // One red light is always in the scene (intensity 0 when idle) so the light count never changes

    t = Math.max(0, Math.min(1, t));

    flickerInterval: 0.05,    // shortest time between blinks (seconds)
    flickerIntervalRandom: 0.07, // extra random time added to each blink
    blurClones: 4,            // number of see-through blur copies (split between left and right)
    blurSpread: 0.4,          // how far the outermost blur copy sits from the body
    blurJitter: 0.04,         // how much the blur copies shake sideways

    blurInnerOpacity: 0.20,   // opacity of the copies closest to the body
    blurOuterOpacity: 0.05,   // opacity of the outermost copies
    blurShimmer: 0.4,         // how much the blur copies' opacity flickers (0 = steady)

  // Sideways speed blur: translucent copies of a character fanned out left and right of it
  // (along the screen's horizontal), shimmering while the character stands still.
  // Sideways offsets for the blur copies: alternate left/right, packed closer together near the body
  function blurOffsets() {
    var n = Math.max(0, Math.round(TELEPORT.blurClones));
    var perSide = Math.ceil(n / 2), out = [];
    for (var i = 0; i < n; i++) {
      var k = Math.floor(i / 2);

  }

        if (n.isMesh && n.material && !n.userData.fx && seen.indexOf(n.material) < 0) {
          seen.push(n.material);

          n.material.opacity = TELEPORT.bodyOpacity;
          n.material.needsUpdate = true;

      });

      tp.bodyMats.forEach(function (m) {
        m.transparent = false;
        m.opacity = 1;
        m.needsUpdate = true;
      });
      tp.bodyMats = [];
    }

    var srcNodes = [];
    source.traverse(function (n) { srcNodes.push(n); });
    return blurOffsets().map(function (off) {
      var obj = source.clone(true);
      var dstNodes = [];
      var mats = [];
      obj.traverse(function (n) {
        dstNodes.push(n);
        if (n.isSprite || n.userData.fx) n.visible = false; // keep the eye glow, painted eyes and blood off the blur copies
        if (n.isMesh) {

      b.obj.scale.copy(source.scale);
      b.obj.visible = source.visible;

      var hx = gunTarget.x - dummy.root.position.x, hz = gunTarget.z - dummy.root.position.z;
      var hd = Math.sqrt(hx * hx + hz * hz);
      if (!dummy.dead && !dummy.carried && hd < GUN.range && hd > 1.5) fireBullet();
    if (!remoteOnly) {
      var tb = gunTargetBody();
      gunTarget.set(tb.position.x, tb.position.y + 1.6, tb.position.z);
      if (!dummy.dead) dummy.aimAt(gunTarget.x, gunTarget.z);

    }

      if (s.t <= 0) return;

    });

      var b = bullets[i];
      if (DODGE.enabled && eyeOn && !crowClone.active && !b.dodged) {
        // dodgeRel = from you to the bullet; along = how far the bullet still has to fly to reach you
        dodgeRel.set(b.mesh.position.x - player.position.x, b.mesh.position.y - (player.position.y + 1.5),
          b.mesh.position.z - player.position.z);
        var along = -dodgeRel.dot(b.dir);

  );
  ctRing.rotation.x = -Math.PI / 2;
  ctRing.visible = false;
  scene.add(ctRing);
  var ctShadow = new THREE.Mesh(

    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false })
  );
  ctShadow.rotation.x = -Math.PI / 2;
  ctShadow.visible = false;
  scene.add(ctShadow);
  var ctWave = new THREE.Mesh(
    new THREE.RingGeometry(0.8, 1, 56),
    new THREE.MeshBasicMaterial({ color: 0xd9cbb8, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })
  );
  ctWave.rotation.x = -Math.PI / 2;
  ctWave.visible = false;
  scene.add(ctWave);
  var ctCrater = new THREE.Mesh(
    new THREE.CircleGeometry(1, 40),
    new THREE.MeshBasicMaterial({ color: 0x3b3027, transparent: true, opacity: 0, depthWrite: false })
  );
  ctCrater.rotation.x = -Math.PI / 2;
  ctCrater.visible = false;
  scene.add(ctCrater);

  // Dust kicked up where rocks break out of the ground, and by the impact
  var dusts = [];
  for (var di = 0; di < 70; di++) {
    var dsp = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: 0x9a8670, transparent: true, depthWrite: false }));
    dsp.visible = false;
    scene.add(dsp);
    dusts.push({ sp: dsp, t: 0, life: 1, size: 1, vx: 0, vy: 0, vz: 0 });
  }
  var dustCursor = 0;
  var dustCursor = 0, nextChibakuDustId = 1;
  function spawnDust(x, y, z, size, life, vx, vy, vz) {
    var d = dusts[dustCursor];
    dustCursor = (dustCursor + 1) % dusts.length;
    d.netId = nextChibakuDustId++;
    d.sp.position.set(x, y, z);
    d.t = d.life = life;
    d.size = size;
    d.vx = vx || 0; d.vy = vy || 0; d.vz = vz || 0;
    d.sp.visible = true;
  }

  var cb = {
    holding: false, falling: false, t: 0, spawnAcc: 0, spawned: 0, arrived: 0, radius: 0,
    fallT: 0, from: new THREE.Vector3(), to: new THREE.Vector3(),
    flying: [], debris: [], cam: 0, shake: 0, wave: 0, crater: 0, waveR: 0
    flying: [], debris: [], cam: 0, shake: 0, wave: 0, crater: 0, waveR: 0,
    netSurfaceAdds: [], netSurfaceRevision: 0, netSurfaceSentAt: 0
  };
  var cbTmp = new THREE.Vector3(), cbTmp2 = new THREE.Vector3();

  function cbRockFraction() { return Math.min(1, cb.arrived / CHIBAKU.maxRocks); }
  function cbRadiusFor(n) {
    var f = Math.min(1, n / CHIBAKU.maxRocks);
    return CHIBAKU.minRadius + (CHIBAKU.maxRadius - CHIBAKU.minRadius) * Math.sqrt(f);
  }

  function startChibaku() {
    if (!rinnOn || cb.holding || cb.falling || cd.ct > 0) return;
    cb.holding = true;
    cb.t = 0;
    cb.spawnAcc = 0;
    cb.spawned = 0;
    cb.arrived = 0;
    cb.netSurfaceAdds.length = 0;
    cb.netSurfaceRevision = 0;
    cb.netSurfaceSentAt = 0;
    cb.radius = CHIBAKU.minRadius * 0.4;
    ball.position.set(aimPoint.x, CHIBAKU.skyHeight + CHIBAKU.minRadius, aimPoint.z);
    ball.rotation.set(0, 0, 0);
    ballCore.scale.setScalar(0.001);
    ball.visible = true;
    ui.ct.card.classList.add('holding');
    glowT = GLOW_DUR;
    sendAction('Chibaku Tensei', { origin: [aimPoint.x, 0, aimPoint.z], mode: 'radial', range: 3, radius: 3, duration: 0.7 });
  }

  function spawnRock() {
    var a = Math.random() * Math.PI * 2;
    var r = 3 + Math.sqrt(Math.random()) * (CHIBAKU.pullRadius - 3);
    var lim = PLATFORM_HALF - 1;
    var x = Math.max(-lim, Math.min(lim, player.position.x + Math.cos(a) * r));
    var z = Math.max(-lim, Math.min(lim, player.position.z + Math.sin(a) * r));
    var size = CHIBAKU.rockSizeMin + Math.random() * (CHIBAKU.rockSizeMax - CHIBAKU.rockSizeMin);
    var m = new THREE.Mesh(rockGeos[Math.floor(Math.random() * rockGeos.length)], rockMats[Math.floor(Math.random() * rockMats.length)]);
    m.userData.cbRockId = nextChibakuRockId++;
    m.scale.setScalar(size);
    m.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
    m.position.set(x, -size, z);
    m.castShadow = true;
    scene.add(m);
    // Random spot on the sphere this rock will stick to (in the sphere's own space)
    var dir = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1);
    if (dir.lengthSq() < 0.0001) dir.set(0, 1, 0);
    dir.normalize();
    cb.flying.push({
      mesh: m, dir: dir, t: -Math.random() * 0.1, rise: 0.25,
      dur: CHIBAKU.rockFlightTime * (0.75 + Math.random() * 0.5),
      start: new THREE.Vector3(x, size * 0.6, z), size: size,
      spin: new THREE.Vector3(Math.random() * 6 - 3, Math.random() * 6 - 3, Math.random() * 6 - 3)
    });
    spawnDust(x, 0.3, z, 1.2 + size, 0.7, 0, 0.8, 0);
  }

  function releaseChibaku() {
    if (!cb.holding) return;
    cb.holding = false;
    ui.ct.card.classList.remove('holding');
    ctChargeEl.style.width = '0';
    // Rocks still on their way up just drop back down
    cb.flying.forEach(function (r) { toDebris(r.mesh, (Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2); });
    cb.flying.length = 0;
    if (cb.arrived === 0) { ball.visible = false; return; }
    cb.falling = true;
    cb.fallT = 0;
    cb.from.copy(ball.position);
    cb.to.set(aimPoint.x, cb.radius * 0.85, aimPoint.z);
  }

  function toDebris(m, vx, vy, vz) {
    m.getWorldPosition(cbTmp);
    m.getWorldQuaternion(m.quaternion);
    m.getWorldScale(cbTmp2);
    if (m.parent) m.parent.remove(m);
    m.position.copy(cbTmp);
    m.scale.copy(cbTmp2);
    scene.add(m);
    cb.debris.push({
      mesh: m, vx: vx, vy: vy, vz: vz, life: CHIBAKU.debrisLife * (0.7 + Math.random() * 0.6),
      half: cbTmp2.y * 0.5, spin: new THREE.Vector3(Math.random() * 8 - 4, Math.random() * 8 - 4, Math.random() * 8 - 4)
    });
  }

  function chibakuImpact() {
    cb.falling = false;
    var f = cbRockFraction();
    var R = cb.radius;
    var c = ball.position;
    var impactDamage = Math.round(CHIBAKU.minDamage + (CHIBAKU.maxDamage - CHIBAKU.minDamage) * f);
    sendAction('Chibaku Tensei', { origin: [c.x, 0, c.z], mode: 'radial', range: R + CHIBAKU.hitPadding, radius: R + CHIBAKU.hitPadding,
      damage: impactDamage, duration: 0.8 });
    // Damage the target if it's under the sphere
    if (!dummy.dead) {
      var dx = dummy.root.position.x - c.x, dz = dummy.root.position.z - c.z;
      if (Math.sqrt(dx * dx + dz * dz) < R + CHIBAKU.hitPadding) {
        dummy.damage(Math.round(CHIBAKU.minDamage + (CHIBAKU.maxDamage - CHIBAKU.minDamage) * f));
        dummy.damage(impactDamage);
      }
    }
    // The sphere breaks apart: every rock flies outward and tumbles across the ground
    var kids = ball.children.slice();
    kids.forEach(function (k) {
      if (k === ballCore) return;
      k.getWorldPosition(cbTmp);
      var ox = cbTmp.x - c.x, oz = cbTmp.z - c.z;
      var ol = Math.max(0.1, Math.sqrt(ox * ox + oz * oz));
      var sp = 4 + Math.random() * 8 + R;
      toDebris(k, ox / ol * sp, 3 + Math.random() * 6, oz / ol * sp);
    });
    ball.visible = false;
    cd.ct = CD.ct = CHIBAKU.cooldown;
    cb.shake = CHIBAKU.shake * (0.4 + f);
    cb.wave = 1;
    cb.waveR = R;
    ctWave.position.set(c.x, 0.06, c.z);
    ctWave.visible = true;
    cb.crater = 1;
    ctCrater.position.set(c.x, 0.04, c.z);
    ctCrater.scale.setScalar(R * 1.15);
    ctCrater.visible = true;
    for (var i = 0; i < 24; i++) {
      var a = (i / 24) * Math.PI * 2;
      var s = 3 + Math.random() * 4 + R;
      spawnDust(c.x + Math.cos(a) * R, 0.5, c.z + Math.sin(a) * R, 2 + R * 0.6, 1.1, Math.cos(a) * s, 1 + Math.random(), Math.sin(a) * s);
    }
  }

  function updateChibaku(dt) {
    updateRinneganEyes(dt);
    if (cb.holding) {
      cb.t += dt;
      var canSpawn = cb.t < CHIBAKU.maxHold && cb.spawned < CHIBAKU.maxRocks;
      if (canSpawn) {
        cb.spawnAcc += dt * CHIBAKU.rocksPerSecond;
        while (cb.spawnAcc >= 1 && cb.spawned < CHIBAKU.maxRocks) {
          cb.spawnAcc -= 1;
          cb.spawned++;
          spawnRock();
        }
      }
      ctChargeEl.style.width = (Math.min(1, cb.t / CHIBAKU.maxHold) * 100) + '%';
      cb.radius += (cbRadiusFor(cb.arrived) - cb.radius) * Math.min(1, dt * 4);
      cbTmp.set(aimPoint.x, CHIBAKU.skyHeight + cb.radius, aimPoint.z);
      ball.position.lerp(cbTmp, Math.min(1, dt * CHIBAKU.followSpeed));
      ball.rotation.y += dt * 0.5;
      ball.rotation.x += dt * 0.2;
      ballCore.scale.setScalar(Math.max(0.001, cb.arrived ? cb.radius * 0.92 : 0.001));
    } else if (cb.falling) {
      cb.fallT += dt;
      var p = Math.min(1, cb.fallT / CHIBAKU.fallTime);
      ball.position.lerpVectors(cb.from, cb.to, p * p);
      ball.rotation.x += dt * 3;
      if (p >= 1) chibakuImpact();
    }

    // Target ring + shadow on the ground under the sphere
    var showMark = cb.holding || cb.falling;
    ctRing.visible = ctShadow.visible = showMark;
    if (showMark) {
      var mx = cb.falling ? cb.to.x : aimPoint.x, mz = cb.falling ? cb.to.z : aimPoint.z;
      var hr = cb.radius + CHIBAKU.hitPadding;
      ctRing.position.set(mx, 0.09, mz);
      ctRing.scale.setScalar(hr * (1 + 0.04 * Math.sin(performance.now() / 110)));
      ctShadow.position.set(ball.position.x, 0.05, ball.position.z);
      ctShadow.scale.setScalar(Math.max(0.01, cb.radius));
      ctShadow.material.opacity = 0.15 + 0.25 * (1 - Math.min(1, (ball.position.y - cb.radius) / CHIBAKU.skyHeight));
    }

    // Rocks breaking out of the ground and flying up into the sphere
    for (var i = cb.flying.length - 1; i >= 0; i--) {
      var r = cb.flying[i];
      r.t += dt;
      if (r.t < 0) continue;
      r.mesh.rotation.x += r.spin.x * dt;
      r.mesh.rotation.y += r.spin.y * dt;
      r.mesh.rotation.z += r.spin.z * dt;
      if (r.t < r.rise) {
        r.mesh.position.y = -r.size + (r.start.y + r.size) * easeOut(r.t / r.rise);
        continue;
      }
      var q = Math.min(1, (r.t - r.rise) / r.dur);
      var surf = cb.radius * 0.9 + r.size * 0.3;
      cbTmp.copy(r.dir).multiplyScalar(surf).applyQuaternion(ball.quaternion).add(ball.position);
      // Curved path: up first, then into the sphere
      var e = q * q * (3 - 2 * q);
      var cx = r.start.x + (cbTmp.x - r.start.x) * 0.25, cy = r.start.y + (cbTmp.y - r.start.y) * 0.9, cz = r.start.z + (cbTmp.z - r.start.z) * 0.25;
      var u = 1 - e;
      r.mesh.position.set(
        u * u * r.start.x + 2 * u * e * cx + e * e * cbTmp.x,
        u * u * r.start.y + 2 * u * e * cy + e * e * cbTmp.y,
        u * u * r.start.z + 2 * u * e * cz + e * e * cbTmp.z
      );
      if (q >= 1) {
        ball.add(r.mesh);
        r.mesh.position.copy(r.dir).multiplyScalar(surf);
        cb.arrived++;
        cb.netSurfaceRevision++;
        cb.netSurfaceAdds.push(chibakuRockSnapshot(r.mesh));
        cb.flying.splice(i, 1);
      }
    }

    // Broken rocks bounce, settle, then sink back into the ground
    for (var j = cb.debris.length - 1; j >= 0; j--) {
      var d = cb.debris[j];
      d.life -= dt;
      if (d.life <= 0) { scene.remove(d.mesh); cb.debris.splice(j, 1); continue; }
      var m = d.mesh;
      if (d.life < 0.8) { m.position.y -= dt * 1.2; continue; }
      d.vy -= 28 * dt;
      m.position.x += d.vx * dt;
      m.position.y += d.vy * dt;
      m.position.z += d.vz * dt;
      if (m.position.y < d.half) {
        m.position.y = d.half;
        d.vy = Math.abs(d.vy) > 2 ? -d.vy * 0.3 : 0;
        d.vx *= 0.6; d.vz *= 0.6;
        d.spin.multiplyScalar(0.6);
      }
      m.rotation.x += d.spin.x * dt;
      m.rotation.z += d.spin.z * dt;
    }

    for (var k = 0; k < dusts.length; k++) {
      var ds = dusts[k];
      if (ds.t <= 0) continue;
      ds.t -= dt;
      if (ds.t <= 0) { ds.sp.visible = false; continue; }
      var lf = ds.t / ds.life;
      ds.sp.position.x += ds.vx * dt;
      ds.sp.position.y += ds.vy * dt;
      ds.sp.position.z += ds.vz * dt;
      ds.vx *= 1 - dt * 2; ds.vz *= 1 - dt * 2;
      var sz = ds.size * (0.6 + (1 - lf) * 1.2);
      ds.sp.scale.set(sz, sz, 1);
      ds.sp.material.opacity = lf * 0.7;
    }

    if (cb.wave > 0) {
      cb.wave = Math.max(0, cb.wave - dt / 0.6);
      var w = 1 - cb.wave;
      ctWave.scale.setScalar(cb.waveR + 1 + easeOut(w) * (cb.waveR * 3 + 8));
      ctWave.material.opacity = cb.wave * 0.8;
      if (cb.wave === 0) ctWave.visible = false;
    }
    if (cb.crater > 0) {
      cb.crater = Math.max(0, cb.crater - dt / 4);
      ctCrater.material.opacity = Math.min(1, cb.crater * 3) * 0.55;
      if (cb.crater === 0) ctCrater.visible = false;
    }

    cb.cam += ((cb.holding || cb.falling ? 1 : 0) - cb.cam) * Math.min(1, dt * 2.5);
    cb.shake = Math.max(0, cb.shake - dt * 1.5);
  }


  function updateSharingan(dt) {
    var t = performance.now() / 1000;

    // The red glow only flashes for a split second
    var k = 0;
    if (glowT > 0) {
      glowT = Math.max(0, glowT - dt);
      var e = GLOW_DUR - glowT;
      k = e < 0.06 ? e / 0.06 : Math.max(0, 1 - (e - 0.06) / (GLOW_DUR - 0.06));
    }
    var show = k > 0.01;
    eyeFx.forEach(function (f) {
      f.halo.visible = f.streak.visible = show;
      if (!show) return;
      f.streak.scale.set(3.6 * (0.5 + k), 0.5 * (0.6 + 0.4 * k), 1);
      f.streak.material.opacity = 0.95 * k;
      var hs = 0.9 * (0.6 + k);
      f.halo.scale.set(hs, hs, 1);
      f.halo.material.opacity = k;
    });

    // Eye pattern animation
    if (eyeOn) {
      var spin = t * 0.7;
      if (eyeAnim) {
        eyeAnim.t += dt;
        var p = Math.min(1, eyeAnim.t / eyeAnim.dur);
        eyePlanes.forEach(function (pl) {
          if (eyeAnim.mode === 'appear') {
            var s = 0.5 + 0.5 * easeOut(p);
            pl.shar.material.opacity = Math.min(1, p * 1.6);
            pl.shar.scale.set(s, s, 1);
            pl.shar.rotation.z = (1 - p) * 3 + spin;
          } else {
            var o = pl[eyeAnim.out], n = pl[eyeAnim.inn];
            // old pattern spins fast, shrinks and fades; new one spins in from small and settles
            o.material.opacity = Math.max(0, 1 - p * 1.6);
            var os = 1 - 0.65 * p;
            o.scale.set(os, os, 1);
            o.rotation.z += dt * 25;
            n.material.opacity = Math.min(1, Math.max(0, (p - 0.2) / 0.5));
            var ns = 0.35 + 0.65 * easeOutBack(p);
            n.scale.set(ns, ns, 1);
            n.rotation.z = -9 * (1 - p) * (1 - p) + spin;
          }
        });
        if (p >= 1) {
          if (eyeAnim.mode === 'switch') {
            eyePlanes.forEach(function (pl) {
              pl[eyeAnim.out].visible = false;
              pl[eyeAnim.out].material.opacity = 0;
              pl[eyeAnim.inn].material.opacity = 1;
              pl[eyeAnim.inn].scale.set(1, 1, 1);
            });
          } else {
            eyePlanes.forEach(function (pl) { pl.shar.material.opacity = 1; pl.shar.scale.set(1, 1, 1); });
          }
          eyeAnim = null;
        }
      } else {
        eyePlanes.forEach(function (pl) { (mangOn ? pl.mang : pl.shar).rotation.z = spin; });
      }
    }

    // Blood: runs down from each eye and drips off the chin for about 2 seconds, then fades away
    if (bloodPhase === 'run') {
      bloodT += dt;
      if (bloodT >= bloodRun) bloodPhase = 'fade';
    } else if (bloodPhase === 'fade') {
      bloodT += dt;
      var fo = 1 - (bloodT - bloodRun) / BLOOD_FADE;
      if (fo <= 0) {
        bloodPhase = 'off';
        bloodMat.opacity = 1;
        bloods.forEach(function (b) { b.len = 0; });
      } else {
        bloodMat.opacity = fo;
      }
    }
    bloods.forEach(function (b, i) {
      if (bloodPhase === 'run' && bloodT > 0.25) b.len = Math.min(MAX_BLOOD, b.len + dt * bloodRate);
      var vis = b.len > 0.002;
      b.streak.visible = vis;
      b.bead.visible = vis;
      if (vis) {
        b.streak.scale.y = b.len;
        b.streak.scale.x = 1 + 0.18 * Math.sin(t * 9 + i * 2);
        b.bead.position.set(b.x, -0.02 - b.len, 0.42);
      }
      b.drops.forEach(function (d) {
        if (b.len < MAX_BLOOD - 0.001) { d.m.visible = false; d.t = -0.1; return; }
        d.t += dt;
        if (d.t >= d.period) { d.t = 0; d.period = 0.9 + Math.random() * 0.7; }
        var FALL = 0.55;
        if (d.t >= 0 && d.t < FALL) {
          d.m.visible = true;
          d.m.position.set(b.x, -0.4 - 3.5 * d.t * d.t, 0.42);
          var sc = 1 - Math.pow(d.t / FALL, 3) * 0.6;
          d.m.scale.set(sc, sc, sc);
        } else {
          d.m.visible = false;
        }
      });
    });
  }


  function startTornado() {
    if (!equipped || cd.z > 0 || tornado.state.active || dash.active || dash.held) return;
    tornado.begin();
    ui.z.card.classList.add('holding');

    });
    };

  function startDash() {
    if (!equipped || cd.x > 0 || dash.active || dash.held || tornado.state.held) return;
    dash.held = true;
    dash.heldT = 0;
    dashPreview.visible = true;
    ui.x.card.classList.add('holding');
  }
  function releaseDash() {
    if (!dash.held) return;
    dash.held = false;
    dashPreview.visible = false;
    reticle.visible = false;
    ui.x.card.classList.remove('holding');
    dash.range = dashRange(dash.heldT);
    dash.dur = 0.3 + 0.1 * (dash.range - DASH_MIN) / (DASH_MAX - DASH_MIN);
    dash.dir.copy(aimDir);
    dash.start.copy(player.position);
    sendAction('Dash', { origin: [dash.start.x, dash.start.y + 1.4, dash.start.z], direction: dash.dir.toArray(),
      to: [dash.start.x + dash.dir.x * dash.range, dash.start.y, dash.start.z + dash.dir.z * dash.range],
      range: dash.range, radius: DASH_HIT_RADIUS, damage: DASH_DAMAGE, duration: dash.dur + 0.35 });
    dash.prev.copy(player.position);
    dash.t = 0;
    dash.hit = false;
    dash.active = true;
    cd.x = CD.x;
    facing = Math.atan2(dash.dir.x, dash.dir.z);
    atk.active = false;
    dashTrail.group.visible = true;
    dashTrail.fade = 1;
  }

  function startQDash() {
    if (qd.cd > 0 || dash.active) return;
    var f = (held('forward') ? 1 : 0) - (held('back') ? 1 : 0);
    var sd = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
    var syq = Math.sin(yaw), cyq = Math.cos(yaw);
    qd.dir.set(-syq * f + cyq * sd, 0, -cyq * f - syq * sd);
    if (qd.dir.lengthSq() > 0) qd.dir.normalize();
    else qd.dir.set(Math.sin(facing), 0, Math.cos(facing));
    qd.active = true;
    qd.t = 0;
    qd.cd = Q_CD;
    qd.side = -qd.side; // the trailing foot alternates with every dash
    qd.start.copy(player.position);
    sendAction('Q Dash', { origin: [qd.start.x, qd.start.y + 1.2, qd.start.z], direction: qd.dir.toArray(),
      to: [qd.start.x + qd.dir.x * Q_DIST, qd.start.y, qd.start.z + qd.dir.z * Q_DIST], range: Q_DIST, radius: 1.1, duration: 0.4 });
    qd.fade = 1;
    qTrail.visible = true;
    spawnPuffs(player.position, qd.dir);
  }

  // ---------------------------------------------------------------- Shinra Tensei (Rinnegan, hold)
  // Hold: your arm points at the cursor and a target you point at is pulled to your hand, where it
  // floats lying flat. Let go: it's blasted away and takes damage.
  // Settings (also reachable from the console as game.shinra)
  var SHINRA = {
    cooldown: 8,          // seconds before you can use it again (starts when you let go of a target)
    range: 100,            // how far away a target can be grabbed
    pullTime: 1,       // seconds for the target to fly to your hand
    pullArc: 1.5,         // how high the target arcs while flying to you
    holdDistance: 2.2,    // how far in front of your hand the target floats
    floatBob: 0.12,       // how much the held target bobs up and down
    knockback: 70,        // how far the target is blasted when you let go
    knockbackTime: 0.9,   // how long the blast flight lasts (seconds)
    tumble: 9,            // how fast the target spins while blasted away
    damage: 30,           // damage when blasted
    landDamage: 10,       // extra damage when it slams into the ground
    shockwaveSize: 10      // size of the shockwave ring when you let go
  };
  window.game.shinra = SHINRA;
  CD.st = SHINRA.cooldown;
  var SH_GRAVITY = 30;

  var sh = { held: false, phase: 'none', t: 0, from: new THREE.Vector3(), fromQ: new THREE.Quaternion(),
  var sh = { held: false, phase: 'none', t: 0, targetId: null, playerT: 0, playerFrom: null, from: new THREE.Vector3(), fromQ: new THREE.Quaternion(),
    vel: new THREE.Vector3(), axis: new THREE.Vector3(), wave: 0 };
  var shHand = new THREE.Vector3(), shTo = new THREE.Vector3(), shQ = new THREE.Quaternion(), shQ2 = new THREE.Quaternion();
  var shX = new THREE.Vector3(), shY = new THREE.Vector3(), shZ = new THREE.Vector3(0, 1, 0), shM = new THREE.Matrix4();
  var shGlow = glowSprite(0xc7b3ff, 1.3);
  var shWave = new THREE.Mesh(new THREE.RingGeometry(0.75, 1, 48),
    new THREE.MeshBasicMaterial({ color: 0xe2d8ff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
  shWave.visible = false;
  scene.add(shWave);

  // Where the held target floats: lying flat on its back along your arm, head toward you, in front of your hand
  function shinraHoldPose(t) {
    armMeshR.localToWorld(shHand.set(0, -0.5, 0));
    shY.set(-aimDir.x, 0, -aimDir.z);            // base -> head points back at you
    shX.crossVectors(shY, shZ);
    shM.makeBasis(shX, shY, shZ);
    shQ.setFromRotationMatrix(shM);
    var bob = Math.sin(t * 3) * SHINRA.floatBob;
    // The dummy pivots at its base and its middle is ~1.7 up the body
    shTo.set(shHand.x + aimDir.x * SHINRA.holdDistance - shY.x * 1.7,
      Math.max(0.6, shHand.y) + bob,
      shHand.z + aimDir.z * SHINRA.holdDistance - shY.z * 1.7);
  }

  function startShinra() {
    if (!rinnOn || sh.held || sh.phase !== 'none' || cd.st > 0) return;
    sh.held = true;
    sh.targetId = aimedPeerId && peers[aimedPeerId] ? aimedPeerId : null;
    sh.playerT = 0;
    var shTarget = sh.targetId ? roomTargetPosition(peers[sh.targetId]) : null;
    sh.playerFrom = shTarget ? [shTarget.x, shTarget.y, shTarget.z] : null;
    ui.st.card.classList.add('holding');
    glowT = GLOW_DUR;
  }

  function grabShinra() {
    sh.phase = 'pull';
    sh.t = 0;
    sh.from.copy(dummy.root.position);
    sh.fromQ.copy(dummy.bodyQuaternion);
  }

  function releaseShinra() {
    if (!sh.held) return;
    sh.held = false;
    ui.st.card.classList.remove('holding');
    armMeshR.localToWorld(shHand.set(0, -0.5, 0));
    shWave.position.copy(shHand);
    shWave.lookAt(shHand.x + aimDir.x, shHand.y, shHand.z + aimDir.z);
    shWave.visible = true;
    sh.wave = 1;
    if (sh.targetId && peers[sh.targetId]) {
      var target = roomTargetPosition(peers[sh.targetId]);
      var T = SHINRA.knockbackTime, y0 = target.y;
      var launchY = (0.5 * SH_GRAVITY * T * T - y0) / T;
      sendAction('Shinra Tensei', { origin: [target.x, target.y + 0.2, target.z], mode: 'radial', range: 3.2, radius: 3.2,
        damage: SHINRA.damage, targetIds: [sh.targetId], knockback: [aimDir.x * SHINRA.knockback / T, launchY, aimDir.z * SHINRA.knockback / T],
        landDamage: SHINRA.landDamage, duration: 0.8, localVisual: true });
      sh.targetId = null; sh.playerT = 0; sh.playerFrom = null;
      cd.st = CD.st = SHINRA.cooldown; shGlow.visible = false; return;
    }
    if (sh.targetId) {
      sh.targetId = null; sh.playerT = 0; sh.playerFrom = null;
      cd.st = CD.st = SHINRA.cooldown; shGlow.visible = false; return;
    }
    if (sh.phase !== 'pull' && sh.phase !== 'hold') { sh.phase = 'none'; return; }
    // Blast the target away along your arm and arc it so it lands after knockbackTime
    var T = SHINRA.knockbackTime;
    var y0 = dummy.root.position.y;
    sh.vel.set(aimDir.x * SHINRA.knockback / T, (0.5 * SH_GRAVITY * T * T - y0) / T, aimDir.z * SHINRA.knockback / T);
    sh.axis.set(aimDir.z, 0, -aimDir.x);
    sh.phase = 'fly';
    sh.t = 0;
    sendAction('Shinra Tensei', { origin: [dummy.root.position.x, 0, dummy.root.position.z], mode: 'radial', range: 4.5, radius: 4.5,
      damage: SHINRA.damage, knockback: [aimDir.x * 18, 0, aimDir.z * 18], duration: 0.8 });
    dummy.damage(SHINRA.damage);
    cd.st = CD.st = SHINRA.cooldown;
    shGlow.visible = false;
  }

  function endShinra() {
    if (sh.phase !== 'none') dummy.release();
    sh.phase = 'none';
    sh.targetId = null;
    sh.playerT = 0; sh.playerFrom = null;
    shGlow.visible = false;
  }

  function updateShinra(dt) {
    if (sh.wave > 0) {
      sh.wave = Math.max(0, sh.wave - dt * 2.5);
      var ws = 0.5 + (1 - sh.wave) * SHINRA.shockwaveSize;
      shWave.scale.set(ws, ws, ws);
      shWave.material.opacity = sh.wave * 0.8;
      if (sh.wave === 0) shWave.visible = false;
    }
    // Point at the target while holding: grab it as soon as the cursor is over it
    if (sh.held && sh.phase === 'none' && cursorOnDummy && !dummy.dead && !dummy.carried) {
      var gx = dummy.root.position.x - player.position.x, gz = dummy.root.position.z - player.position.z;
      if (gx * gx + gz * gz < SHINRA.range * SHINRA.range) grabShinra();
    }
    if (sh.held && sh.targetId) {
      if (!peers[sh.targetId]) { sh.targetId = null; sh.playerT = 0; sh.playerFrom = null; }
      else {
        sh.playerT += dt;
        armMeshR.localToWorld(shHand.set(0, -0.5, 0));
        shGlow.position.copy(shHand); shGlow.visible = true; shGlow.material.opacity = 0.65 + 0.35 * Math.sin(sh.playerT * 12);
        return;
      }
    }
    if (sh.phase === 'none') return;
    if (dummy.dead) { endShinra(); return; }
    sh.t += dt;

    if (sh.phase === 'pull' || sh.phase === 'hold') {
      shinraHoldPose(sh.t);
      if (sh.phase === 'pull') {
        var p = Math.min(1, sh.t / SHINRA.pullTime);
        var e = p * p * (3 - 2 * p);
        shQ2.copy(sh.fromQ).slerp(shQ, e);
        dummy.carryQ(
          sh.from.x + (shTo.x - sh.from.x) * e,
          sh.from.y + (shTo.y - sh.from.y) * e + Math.sin(Math.PI * p) * SHINRA.pullArc,
          sh.from.z + (shTo.z - sh.from.z) * e, shQ2);
        if (p >= 1) sh.phase = 'hold';
      } else {
        shQ2.setFromAxisAngle(shY, Math.sin(sh.t * 2.3) * 0.08);
        shQ2.multiply(shQ);
        dummy.carryQ(shTo.x, shTo.y, shTo.z, shQ2);
      }
      shGlow.position.copy(shHand);
      shGlow.visible = true;
      shGlow.material.opacity = 0.65 + 0.35 * Math.sin(sh.t * 12);
      return;
    }

    // Blasted away: fly in an arc, tumbling, then slam into the ground
    var pos = dummy.root.position;
    var lim = PLATFORM_HALF - 1;
    var nx = pos.x + sh.vel.x * dt, nz = pos.z + sh.vel.z * dt;
    if (Math.abs(nx) > lim || Math.abs(nz) > lim) { sh.vel.x = 0; sh.vel.z = 0; nx = Math.max(-lim, Math.min(lim, nx)); nz = Math.max(-lim, Math.min(lim, nz)); }
    sh.vel.y -= SH_GRAVITY * dt;
    var ny = pos.y + sh.vel.y * dt;
    shQ2.setFromAxisAngle(sh.axis, -SHINRA.tumble * dt);
    shQ.copy(dummy.bodyQuaternion).premultiply(shQ2);
    if (ny <= 0 && sh.t > 0.05) {
      dummy.carryQ(nx, 0, nz, shQ);
      dummy.release();
      sh.phase = 'none';
      sendAction('Shinra Tensei', { origin: [nx, 0, nz], mode: 'radial', range: 2.5, radius: 2.5, damage: SHINRA.landDamage, duration: 0.45 });
      dummy.damage(SHINRA.landDamage);
      for (var i = 0; i < 10; i++) {
        var a = (i / 10) * Math.PI * 2;
        spawnDust(nx + Math.cos(a) * 0.8, 0.3, nz + Math.sin(a) * 0.8, 1.6, 0.8, Math.cos(a) * 3, 0.8, Math.sin(a) * 3);
      }
      return;
    }
    dummy.carryQ(nx, ny, nz, shQ);
  }

  // ---------------------------------------------------------------- Input (keys are set in KEYS at the top)
  function held(action) {
    var l = keyList(action);
    for (var i = 0; i < l.length; i++) if (keys[l[i]]) return true;
    return false;
  }
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === ' ' || k.indexOf('arrow') === 0) e.preventDefault();
    k = k === 'spacebar' ? ' ' : k;
    keys[k] = true;
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (isKey(k, 'katana')) setEquipped(!equipped);
    if (isKey(k, 'pistol')) equipPistol(!pistolEquipped);
    if (isKey(k, 'sharingan')) setSharingan(!eyeOn);
    if (isKey(k, 'rinnegan')) setRinnegan(!rinnOn);
    if (isKey(k, 'mangekyou')) toggleMangekyou();
    if (isKey(k, 'chibaku tensei') && rinnOn) startChibaku();
    if (isKey(k, 'tsukuyomi') && !rinnOn) startTsukuyomi();
    if (isKey(k, 'amaterasu') && !rinnOn) startAmaterasu();
    if (isKey(k, 'shinra tensei') && rinnOn) startShinra();
    if (isKey(k, 'revolving ravager')) startTornado();
    var summoned = false;
    if (isKey(k, 'tsukuyomi clone') && tsuk.active) { spawnTsukClone(); summoned = true; }
    if (isKey(k, 'slayer of goliath') && !summoned) startDash();
    if (isKey(k, 'quick dash')) startQDash();
    if (isKey(k, 'clone')) toggleClone();
    if (isKey(k, 'teleport')) startTeleport();
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    k = k === 'spacebar' ? ' ' : k;
    keys[k] = false;
    if (isKey(k, 'revolving ravager')) releaseTornado();
    if (isKey(k, 'slayer of goliath')) releaseDash();
    if (isKey(k, 'chibaku tensei')) releaseChibaku();
    if (isKey(k, 'shinra tensei')) releaseShinra();
  });
  window.addEventListener('blur', function () {
    keys = {};
    leftHeld = false;
    cancelHeld();
    releaseChibaku();
    releaseShinra();
  });

  // Track the cursor for aiming
  window.addEventListener('pointermove', function (e) {
    mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  });

  // Right-drag (or any non-attack drag) orbits the camera; left click attacks while equipped
  var dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener('pointerdown', function (e) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (e.button === 0 && pistolEquipped) { firePlayerGun(); return; }
    if (e.button === 0 && equipped) { leftHeld = true; return; }
    dragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    yaw -= (e.clientX - lastX) * 0.006;
    pitch += (e.clientY - lastY) * 0.005;
    pitch = Math.max(0.05, Math.min(1.3, pitch));
    lastX = e.clientX; lastY = e.clientY;
  });
  function endPointer() { dragging = false; leftHeld = false; }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    dist *= Math.exp(e.deltaY * 0.001);
    dist = Math.max(3, Math.min(40, dist));
  }, { passive: false });

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  function angleLerp(a, b, t) {
    var d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    return a + d * t;
  }

  // ---------------------------------------------------------------- Main loop
  var clock = new THREE.Clock();
  var moveDir = new THREE.Vector3();
  var camTarget = new THREE.Vector3();

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05);

    updateAim();
    syncRoom(dt);

    // Cooldowns
    cd.z = Math.max(0, cd.z - dt);
    cd.x = Math.max(0, cd.x - dt);
    cd.c = Math.max(0, cd.c - dt);
    cd.a = Math.max(0, cd.a - dt);
    cd.v = Math.max(0, cd.v - dt);
    cd.ct = Math.max(0, cd.ct - dt);
    cd.st = Math.max(0, cd.st - dt);
    atk.cd = Math.max(0, atk.cd - dt);
    qd.cd = Math.max(0, qd.cd - dt);
    if (qd.active) {
      qd.t += dt;
      if (qd.t >= Q_DUR) qd.active = false;
    }
    if (dash.active) qd.active = false;
    updateCooldownUI();

    // Normal attack (hold left mouse to keep swinging)
    if (equipped && leftHeld) startAttack();
    if (pistolCooldown > 0) pistolCooldown = Math.max(0, pistolCooldown - dt);
    for (var pi = pistolBullets.length - 1; pi >= 0; pi--) { pistolBullets[pi].t -= dt; if (pistolBullets[pi].t <= 0) { scene.remove(pistolBullets[pi].mesh); pistolBullets[pi].mesh.geometry.dispose(); pistolBullets[pi].mesh.material.dispose(); pistolBullets.splice(pi, 1); } }
    if (pistolCooldown > 0) pistolCooldown = Math.max(0, pistolCooldown - dt);
    for (var pi = pistolBullets.length - 1; pi >= 0; pi--) { pistolBullets[pi].t -= dt; if (pistolBullets[pi].t <= 0) { scene.remove(pistolBullets[pi].mesh); pistolBullets[pi].mesh.geometry.dispose(); pistolBullets[pi].mesh.material.dispose(); pistolBullets.splice(pi, 1); } }
    if (atk.active) {
      atk.t += dt;
      var ap = atk.t / ATK_DUR;
      if (!atk.hit && ap >= 0.35) { atk.hit = true; meleeHit(); }
      if (ap >= 1) atk.active = false;
    }

    // Movement relative to camera
    var fwd = (held('forward') ? 1 : 0) - (held('back') ? 1 : 0);
    var side = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
    var sy = Math.sin(yaw), cy = Math.cos(yaw);
    moveDir.set(-sy * fwd + cy * side, 0, -cy * fwd - sy * side);
    var moving = moveDir.lengthSq() > 0;

    var incomingTargetBody = crowClone.active && crowClone.body ? crowClone.body : player;
    if (incomingTsuk.active) {
      incomingTargetBody.position.set(incomingTsuk.x, CROSS_LIFT * easeOut(incomingTsuk.rise), incomingTsuk.z);
      vel.set(0, 0, 0); onGround = false;
    } else if (incomingShinra.active) {
      var sf = incomingShinra.from, st = incomingShinra.to;
      if (incomingShinra.phase === 'pull') {
        var sp = Math.min(1, Math.max(0, incomingShinra.t / SHINRA.pullTime)), se = sp * sp * (3 - 2 * sp);
        incomingTargetBody.position.set(sf[0] + (st[0] - sf[0]) * se,
          sf[1] + (st[1] - sf[1]) * se + Math.sin(Math.PI * sp) * SHINRA.pullArc,
          sf[2] + (st[2] - sf[2]) * se);
      } else incomingTargetBody.position.set(st[0], st[1], st[2]);
      vel.set(0, 0, 0); onGround = false;
    } else if (incomingRavager.active) {
      var ravagerBob = incomingRavager.phase === 'carry' ? Math.sin(incomingRavager.carryT * 7) : Math.sin(incomingRavager.spin * 0.6);
      incomingTargetBody.position.set(incomingRavager.x, 0.9 + ravagerBob * 0.3, incomingRavager.z);
      vel.set(0, 0, 0); onGround = false;
    if (dash.active) {
    } else if (dash.active) {
      // Dash: fixed-speed burst along the aimed line, ignores gravity and the dummy's collision
      dash.t += dt;
      dash.prev.copy(player.position);
      var dashStep = Math.min(dash.range / dash.dur * dt, dash.range - Math.sqrt(
        Math.pow(player.position.x - dash.start.x, 2) + Math.pow(player.position.z - dash.start.z, 2)));
      player.position.x += dash.dir.x * Math.max(0, dashStep);
      player.position.z += dash.dir.z * Math.max(0, dashStep);
      var lim = PLATFORM_HALF - 0.5;
      player.position.x = Math.max(-lim, Math.min(lim, player.position.x));
      player.position.z = Math.max(-lim, Math.min(lim, player.position.z));
      vel.set(0, 0, 0);
      facing = Math.atan2(dash.dir.x, dash.dir.z);
      if (!dash.hit && !dummy.dead &&
          segDist(dummy.root.position.x, dummy.root.position.z, dash.prev.x, dash.prev.z, player.position.x, player.position.z) < DASH_HIT_RADIUS) {
        dash.hit = true;
        strike.pending = true;
        strike.t = STRIKE_DELAY;
      }
      if (dash.t >= dash.dur) dash.active = false;
    } else {
      if (qd.active) {
      if (incomingShinraFlight.active) {
        // Keep the launch velocity until the target lands, as the dummy's knockback arc does.
      } else if (qd.active) {
        vel.x = qd.dir.x * (Q_DIST / Q_DUR);
        vel.z = qd.dir.z * (Q_DIST / Q_DUR);
      } else if (moving) {
        moveDir.normalize();
        vel.x = moveDir.x * SPEED;
        vel.z = moveDir.z * SPEED;
      } else {
        vel.x = 0; vel.z = 0;
      }

      // Facing: attack locks it, aiming abilities turn toward the cursor, otherwise face the walk direction
      if (qd.active) {
        facing = Math.atan2(qd.dir.x, qd.dir.z);
      } else if (atk.active) {
        // keep the facing chosen when the swing started
      } else if (tornado.state.held || dash.held || sh.held) {
        facing = angleLerp(facing, Math.atan2(aimDir.x, aimDir.z), Math.min(1, dt * 16));
      } else if (pistolEquipped) {
        facing = angleLerp(facing, Math.atan2(aimDir.x, aimDir.z), Math.min(1, dt * 16));
      } else if (moving) {
        facing = angleLerp(facing, Math.atan2(moveDir.x, moveDir.z), Math.min(1, dt * 14));
      }

      // Jump + gravity
      if (held('jump') && onGround) { vel.y = JUMP; onGround = false; }
      vel.y -= GRAVITY * dt;
      vel.y -= incomingShinraFlight.active ? SH_GRAVITY * dt : GRAVITY * dt;

      player.position.x += vel.x * dt;
      player.position.z += vel.z * dt;
      player.position.y += vel.y * dt;

      if (dodge.active) {
        dodge.t += dt;
        var dstep = DODGE.distance / DODGE.duration * dt;
        var dlim = PLATFORM_HALF - 0.5;
        player.position.x = Math.max(-dlim, Math.min(dlim, player.position.x + dodge.dir.x * dstep));
        player.position.z = Math.max(-dlim, Math.min(dlim, player.position.z + dodge.dir.z * dstep));
        if (dodge.t >= DODGE.duration) dodge.active = false;
      }

      // Keep the player from walking through the dummy
      if (!dummy.dead && !dummy.carried && player.position.y < 3.5) {
        var ddx = player.position.x - dummy.root.position.x;
        var ddz = player.position.z - dummy.root.position.z;
        var dd = Math.sqrt(ddx * ddx + ddz * ddz);
        var minD = 1.2;
        if (dd < minD) {
          if (dd < 0.001) { ddx = 0; ddz = 1; dd = 1; }
          player.position.x = dummy.root.position.x + ddx / dd * minD;
          player.position.z = dummy.root.position.z + ddz / dd * minD;
        }
      }
    }

    // Platform collision (only while over the platform)
    var overPlatform = Math.abs(player.position.x) <= PLATFORM_HALF && Math.abs(player.position.z) <= PLATFORM_HALF;
    if (overPlatform && player.position.y <= 0 && player.position.y > -1.2) {
      player.position.y = 0;
      vel.y = 0;
      onGround = true;
    } else if (player.position.y < -0.05 || !overPlatform) {
      onGround = false;
    }
    if (incomingShinraFlight.active && overPlatform && player.position.y === 0 && vel.y === 0) {
      var landingDamage = incomingShinraFlight.landDamage;
      incomingShinraFlight.active = false; incomingShinraFlight.landDamage = 0;
      if (landingDamage > 0) hurtPlayer(landingDamage);
      for (var li = 0; li < 10; li++) {
        var la = (li / 10) * Math.PI * 2;
        spawnDust(player.position.x + Math.cos(la) * 0.8, 0.3, player.position.z + Math.sin(la) * 0.8, 1.6, 0.8, Math.cos(la) * 3, 0.8, Math.sin(la) * 3);
      }
      sendAction('Impact', { origin: [player.position.x, 0, player.position.z], mode: 'radial', range: 2.5, radius: 2.5, duration: 0.45, localVisual: true, targetIds: [] });
    }
    if (player.position.y < -30) resetPlayer();

    dummy.update(dt);
    dummy.update(dt, roomActive && !isRoomHost);
    tornado.update(dt);
    updateDashTrail(dt);
    updateStrike(dt);
    updateQFx(dt);
    updateTsukuyomi(dt);
    updateAmaterasu(dt);
    updateGun(dt);
    updateGun(dt, roomActive && !isRoomHost);
    updateClone(dt);
    updateChibaku(dt);
    updateShinra(dt);
    updateTeleportFx(dt);

    // Slayer of Goliath charge: range grows while held, capped at 2s, flames at full charge
    if (dash.held) {
      var wasMax = dash.heldT >= CHARGE_TIME;
      dash.heldT = Math.min(CHARGE_TIME, dash.heldT + dt);
      if (!wasMax && dash.heldT >= CHARGE_TIME) burstFlames(14);
      if (dash.heldT >= CHARGE_TIME) emitFlames(dt);
    }
    updateFlames(dt);
    updateChargeUI();

    // Aim helpers while an ability is held
    if (tornado.state.held) {
      reticle.visible = true;
      reticle.position.set(player.position.x + aimDir.x * RAVAGER_RANGE, 0.08, player.position.z + aimDir.z * RAVAGER_RANGE);
    } else if (dash.held) {
      // The dash stops at the platform edge, so the preview does too
      var plen = dashRange(dash.heldT);
      var edge = PLATFORM_HALF - 0.5;
      if (aimDir.x > 0.0001) plen = Math.min(plen, (edge - player.position.x) / aimDir.x);
      else if (aimDir.x < -0.0001) plen = Math.min(plen, (-edge - player.position.x) / aimDir.x);
      if (aimDir.z > 0.0001) plen = Math.min(plen, (edge - player.position.z) / aimDir.z);
      else if (aimDir.z < -0.0001) plen = Math.min(plen, (-edge - player.position.z) / aimDir.z);
      plen = Math.max(0.1, plen);
      var endX = player.position.x + aimDir.x * plen;
      var endZ = player.position.z + aimDir.z * plen;
      dashPreview.position.set(player.position.x + aimDir.x * plen / 2, 0.07, player.position.z + aimDir.z * plen / 2);
      dashPreview.scale.z = plen;
      dashPreview.rotation.y = Math.atan2(aimDir.x, aimDir.z);
      reticle.visible = true;
      reticle.position.set(endX, 0.08, endZ);
    }

    // Slash arc
    if (slash.group.visible) {
      slash.t -= dt;
      if (slash.t <= 0) {
        slash.group.visible = false;
      } else {
        var sr = slash.t / slash.dur;
        slash.mat.opacity = sr * 0.85;
        slash.group.position.set(player.position.x, player.position.y + 1.3, player.position.z);
        slash.group.rotation.y = facing;
        slash.group.rotation.z = slash.roll;
        slash.group.scale.setScalar(1 + (1 - sr) * 0.25);
      }
    }

    // Pose
    player.rotation.y = facing;
    player.rotation.y = incomingRavager.active ? facing + incomingRavager.spin : facing;
    var swing = 0;
    if (moving && onGround && !dash.active) {
      walkPhase += dt * 10;
      swing = Math.sin(walkPhase) * 0.8;
    } else if (!onGround) {
      swing = 0.2;
      walkPhase = 0;
    } else {
      walkPhase = 0;
    }
    var armBase = equipped ? -0.6 : 0;
    var armAmp = equipped ? 0.55 : 1;
    legL.rotation.x = swing;
    legR.rotation.x = -swing;
    armL.rotation.x = armBase - swing * armAmp;
    armR.rotation.x = armBase + swing * armAmp;
    if (!onGround) {
      var up = equipped ? -1.4 : -2.6;
      armL.rotation.x = up; armR.rotation.x = up;
    }
    if (tornado.state.held || dash.held) {
      armL.rotation.x = -1.2; armR.rotation.x = -1.2;
    }
    if (sh.held) armR.rotation.x = -Math.PI / 2;  // Shinra Tensei: right arm points at the cursor
    if (pistolEquipped) armR.rotation.x = -Math.PI / 2;
    if (dash.active) {
      armL.rotation.x = 1.4; armR.rotation.x = 1.4;
      legL.rotation.x = 0.8; legR.rotation.x = -0.8;
    }
    if (qd.active && !dash.active) {
      // Q dash pose: arms swept back, legs in a long stride, body leaning into the dash
      armL.rotation.x = 1.5; armR.rotation.x = 1.5;
      legL.rotation.x = 0.9 * qd.side; legR.rotation.x = -0.9 * qd.side;
    }
    if (incomingShinra.active) {
      armL.rotation.x = -0.9; armR.rotation.x = -0.9; legL.rotation.x = 0.15; legR.rotation.x = -0.15;
      player.rotation.x = -Math.PI / 2; player.rotation.z = 0;
    } else if (incomingRavager.active) {
      armL.rotation.x = 1.2; armR.rotation.x = -1.2; legL.rotation.x = 0.8; legR.rotation.x = -0.8;
      player.rotation.x = incomingRavager.tiltX; player.rotation.z = incomingRavager.tiltZ;
    } else {
    lean += ((qd.active && !dash.active ? 0.55 : 0) - lean) * Math.min(1, dt * 18);
    player.rotation.x = lean;
      lean += ((qd.active && !dash.active ? 0.55 : 0) - lean) * Math.min(1, dt * 18);
      player.rotation.x = lean;
    }
    var rollTarget = dodge.active ? -(dodge.dir.x * Math.cos(facing) - dodge.dir.z * Math.sin(facing)) * DODGE.lean : 0;
    dodge.roll += (rollTarget - dodge.roll) * Math.min(1, dt * 25);
    player.rotation.z = dodge.roll;
    player.rotation.z = incomingShinra.active ? 0 : dodge.roll;
    updateAvatarPivot(player);
    if (crowClone.active && crowClone.body) {
      var cloneRoot = crowClone.body;
      var cloneArmL = cloneRoot.getObjectByName('player-arm-left'), cloneArmR = cloneRoot.getObjectByName('player-arm-right');
      var cloneLegL = cloneRoot.getObjectByName('player-leg-left'), cloneLegR = cloneRoot.getObjectByName('player-leg-right');
      if (incomingShinra.active) {
        if (cloneArmL) cloneArmL.rotation.x = -0.9; if (cloneArmR) cloneArmR.rotation.x = -0.9;
        if (cloneLegL) cloneLegL.rotation.x = 0.15; if (cloneLegR) cloneLegR.rotation.x = -0.15;
        cloneRoot.rotation.x = -Math.PI / 2; cloneRoot.rotation.z = 0;
      } else if (incomingRavager.active) {
        if (cloneArmL) cloneArmL.rotation.x = 1.2; if (cloneArmR) cloneArmR.rotation.x = -1.2;
        if (cloneLegL) cloneLegL.rotation.x = 0.8; if (cloneLegR) cloneLegR.rotation.x = -0.8;
        cloneRoot.rotation.x = incomingRavager.tiltX; cloneRoot.rotation.z = incomingRavager.tiltZ;
        cloneRoot.rotation.y = facing + incomingRavager.spin;
      } else {
        if (cloneArmL) cloneArmL.rotation.x = equipped ? -0.6 : 0;
        if (cloneArmR) cloneArmR.rotation.x = equipped ? -0.6 : 0;
        if (cloneLegL) cloneLegL.rotation.x = 0; if (cloneLegR) cloneLegR.rotation.x = 0;
        cloneRoot.rotation.x = 0; cloneRoot.rotation.z = 0;
        cloneRoot.rotation.y = facing;
      }
      updateAvatarPivot(cloneRoot);
    }
    if (atk.active) {
      var pp = Math.min(1, atk.t / ATK_DUR);
      var ease = 1 - (1 - pp) * (1 - pp);
      (atk.arm === 0 ? armL : armR).rotation.x = -2.5 + ease * 2.3;
    }

    // Third-person camera
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var camDist = dist + CHIBAKU.cameraPullBack * cb.cam; // pulls back while Chibaku Tensei is being built
    camTarget.set(player.position.x, player.position.y + 2 + 6 * cb.cam, player.position.z);
    camera.position.set(
      camTarget.x + Math.sin(yaw) * cp * camDist,
      camTarget.y + sp * camDist,
      camTarget.z + Math.cos(yaw) * cp * camDist
    );
    camera.lookAt(camTarget);
    if (cb.shake > 0) {
      camera.position.x += (Math.random() - 0.5) * cb.shake;
      camera.position.y += (Math.random() - 0.5) * cb.shake;
      camera.position.z += (Math.random() - 0.5) * cb.shake;
    }

    // Keep shadow centered on the player
    sun.position.set(player.position.x + 12, 24, player.position.z + 8);
    sun.target.position.copy(player.position);
    sun.target.updateMatrixWorld();

    updateSharingan(dt);
    updateTeleportBlur();

    renderer.render(scene, camera);
  }
  frame();
})();
</script>
